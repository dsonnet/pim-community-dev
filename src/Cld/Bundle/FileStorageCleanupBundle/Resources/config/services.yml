services:
    Cld\Bundle\FileStorageCleanupBundle\Service\FileKeyNormalizer: ~

    # Deterministic versioning snapshot for the Smartoys FileCollection value, registered
    # above Akeneo's generic (buggy) Versioning\Product\CollectionNormalizer (priority 90)
    # so product history stops logging phantom file_path/ignored changes. See the class doc.
    Cld\Bundle\FileStorageCleanupBundle\Normalizer\Versioning\FileCollectionVersioningNormalizer:
        arguments:
            - '@pim_catalog.repository.cached_attribute'
        tags:
            - { name: pim_versioning.serializer.normalizer, priority: 200 }

    Cld\Bundle\FileStorageCleanupBundle\Service\ReusableFileResolver:
        arguments:
            - '@database_connection'
            - '@akeneo_file_storage.repository.file_info'
            - '@akeneo_file_storage.file_storage.filesystem_provider'

    Cld\Bundle\FileStorageCleanupBundle\Service\SurfaceProvider:
        arguments:
            - '@database_connection'

    Cld\Bundle\FileStorageCleanupBundle\Service\ReferencedKeyIndex:
        arguments:
            - '@database_connection'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\FileKeyNormalizer'

    Cld\Bundle\FileStorageCleanupBundle\Service\OrphanDetector:
        arguments:
            - '@database_connection'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\FileKeyNormalizer'

    Cld\Bundle\FileStorageCleanupBundle\Service\SelfCheck:
        arguments:
            - '@database_connection'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\FileKeyNormalizer'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\OrphanDetector'

    Cld\Bundle\FileStorageCleanupBundle\Service\OrphanPurger:
        arguments:
            - '@database_connection'
            - '@akeneo_file_storage.file_storage.filesystem_provider'
            - '%cld_file_storage_cleanup.catalog_storage_root%'

    Cld\Bundle\FileStorageCleanupBundle\Command\PurgeOrphansCommand:
        arguments:
            - '@database_connection'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\SurfaceProvider'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\ReferencedKeyIndex'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\OrphanDetector'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\SelfCheck'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\OrphanPurger'
        tags:
            - { name: console.command }

    Cld\Bundle\FileStorageCleanupBundle\Command\RestoreQuarantineCommand:
        arguments:
            - '@database_connection'
            - '%cld_file_storage_cleanup.catalog_storage_root%'
        tags:
            - { name: console.command }

    Cld\Bundle\FileStorageCleanupBundle\Command\DedupHardlinksCommand:
        arguments:
            - '@database_connection'
            - '%cld_file_storage_cleanup.catalog_storage_root%'
        tags:
            - { name: console.command }

    Cld\Bundle\FileStorageCleanupBundle\Command\MediaSnapshotCommand:
        arguments:
            - '@database_connection'
            - '@akeneo_file_storage.file_storage.filesystem_provider'
            - '@Cld\Bundle\FileStorageCleanupBundle\Service\FileKeyNormalizer'
            - '%cld_file_storage_cleanup.catalog_storage_root%'
        tags:
            - { name: console.command }
